<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register / Sign Up - Ocean Dusk Modern</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dominant: '#F8FAFC', /* Latar dalam (Biru Terang / Netral Bersih) */
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Definisi Gradasi Utama (30%) & Gradasi Aksen (10%) Ocean Dusk */
        .gradient-main {
            background: linear-gradient(135deg, #12315F 0%, #2563EB 50%, #38BDF8 100%);
        }
        .gradient-accent {
            background: linear-gradient(135deg, #FF8A5B 0%, #FFB36B 100%);
        }
        .text-gradient-accent {
            background: linear-gradient(135deg, #FF8A5B 0%, #FFB36B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .input-focus-effect:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<!-- Latar belakang menggunakan gradient gelap bernuansa samudra senja (Ocean Dusk) -->
<body class="bg-gradient-to-br from-[#0a1830] via-[#12315F] to-[#1e3a8a] min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white rounded-2xl shadow-[0_12px_40px_rgb(0,0,0,0.3)] w-full max-w-md p-8 border-t-4 border-[#2563EB] transform transition-all duration-300 hover:shadow-2xl relative overflow-hidden my-6">
        
        <!-- Efek Glow Dekoratif di Sudut Atas -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-[#38BDF8]/15 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-6">
            <!-- Ikon dengan Gradasi Utama -->
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full gradient-main text-white mb-3 shadow-md shadow-[#2563EB]/30">
                <i class="fa-solid fa-user-plus text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Buat Akun Baru</h2>
            <p class="text-sm text-gray-500 mt-1 font-medium">Daftar sekarang dengan sistem <span class="text-gradient-accent font-bold">Ocean Dusk</span></p>
        </div>

        <!-- Register Form -->
        <form id="registerForm" class="space-y-4">
            <div>
                <label for="fullname" class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i class="fa-solid fa-id-card text-gray-400"></i>
                    </div>
                    <input type="text" id="fullname" class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl outline-none input-focus-effect transition-colors bg-dominant text-gray-700 font-medium text-sm" placeholder="Masukkan nama lengkap" required>
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Alamat Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i class="fa-solid fa-envelope text-gray-400"></i>
                    </div>
                    <input type="email" id="email" class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl outline-none input-focus-effect transition-colors bg-dominant text-gray-700 font-medium text-sm" placeholder="nama@email.com" required>
                </div>
            </div>

            <div>
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-gray-400"></i>
                    </div>
                    <input type="text" id="username" class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl outline-none input-focus-effect transition-colors bg-dominant text-gray-700 font-medium text-sm" placeholder="Pilih username" required>
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" id="password" class="w-full pl-10 pr-10 py-2.5 border border-gray-200 rounded-xl outline-none input-focus-effect transition-colors bg-dominant text-gray-700 font-medium text-sm" placeholder="Buat password" required>
                    <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center cursor-pointer text-gray-400 hover:text-[#2563EB] transition-colors" id="togglePassword">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </div>
                </div>
            </div>

            <div class="flex items-center text-sm pt-1">
                <label class="flex items-center text-gray-600 cursor-pointer font-medium">
                    <input type="checkbox" class="rounded border-gray-300 text-[#2563EB] focus:ring-[#2563EB] mr-2 w-4 h-4 accent-[#2563EB]" required>
                    Saya menyetujui <a href="#" class="text-gradient-accent ml-1 font-bold hover:underline">Syarat & Ketentuan</a>
                </label>
            </div>

            <!-- Tombol Register Utama dengan Gradasi Utama & Interaksi Gradasi Aksen -->
            <button type="submit" class="w-full gradient-main text-white font-semibold py-3 rounded-xl hover:opacity-95 transition-all flex justify-center items-center gap-2 group shadow-lg shadow-[#2563EB]/25 mt-2">
                <span>Daftar Sekarang</span>
                <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>

        <!-- Divider -->
        <div class="mt-6 mb-5 relative flex items-center">
            <div class="flex-grow border-t border-gray-100"></div>
            <span class="flex-shrink-0 mx-4 text-gray-400 text-xs font-semibold uppercase tracking-wider">Atau daftar dengan</span>
            <div class="flex-grow border-t border-gray-100"></div>
        </div>

        <!-- Social Register Buttons -->
        <div class="space-y-3">
            <button class="w-full flex items-center justify-center gap-3 py-2.5 border border-gray-200 rounded-xl text-gray-600 bg-white hover:bg-gray-50 transition-colors font-medium hover:border-gray-300 shadow-sm text-sm">
                <i class="fa-brands fa-google text-red-500 text-lg"></i>
                <span>Daftar dengan Google</span>
            </button>
            <button class="w-full flex items-center justify-center gap-3 py-2.5 border border-gray-200 rounded-xl text-gray-600 bg-white hover:bg-gray-50 transition-colors font-medium hover:border-gray-300 shadow-sm text-sm">
                <i class="fa-brands fa-github text-gray-900 text-lg"></i>
                <span>Daftar dengan GitHub</span>
            </button>
            <button class="w-full flex items-center justify-center gap-3 py-2.5 border border-gray-200 rounded-xl text-gray-600 bg-white hover:bg-gray-50 transition-colors font-medium hover:border-gray-300 shadow-sm group text-sm">
                <i class="fa-brands fa-instagram text-transparent bg-clip-text bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 group-hover:scale-110 transition-transform text-lg"></i>
                <span>Daftar dengan Instagram</span>
            </button>
        </div>

        <!-- Footer Link to Login -->
        <div class="text-center mt-6 text-sm text-gray-500">
            Sudah punya akun? <a href="login-v7.html" class="text-gradient-accent font-bold hover:underline">Masuk di sini</a>
        </div>
    </div>

    <!-- jQuery Logic -->
    <script>
        $(document).ready(function() {
            // Toggle Password Visibility
            $('#togglePassword').click(function() {
                let pwdInput = $('#password');
                let icon = $('#eyeIcon');
                
                if (pwdInput.attr('type') === 'password') {
                    pwdInput.attr('type', 'text');
                    icon.removeClass('fa-eye').addClass('fa-eye-slash').addClass('text-[#2563EB]').removeClass('text-gray-400');
                } else {
                    pwdInput.attr('type', 'password');
                    icon.removeClass('fa-eye-slash').addClass('fa-eye').addClass('text-gray-400').removeClass('text-[#2563EB]');
                }
            });

            // Efek interaktif pada tombol submit menggunakan gradasi aksen
            $('#registerForm').submit(function(e) {
                e.preventDefault();
                let btn = $(this).find('button[type="submit"]');
                let originalHtml = btn.html();
                
                // Berubah ke gradasi aksen saat memproses
                btn.html('<i class="fa-solid fa-spinner fa-spin"></i> Memproses Pendaftaran...');
                btn.prop('disabled', true);
                btn.removeClass('gradient-main').addClass('gradient-accent text-gray-900 font-bold');

                // Simulasi delay (misal: proses API)
                setTimeout(function() {
                    btn.html('<i class="fa-solid fa-check"></i> Pendaftaran Berhasil!');
                    
                    setTimeout(function() {
                        btn.html(originalHtml);
                        btn.prop('disabled', false);
                        btn.removeClass('gradient-accent text-gray-900 font-bold').addClass('gradient-main');
                    }, 2000);
                }, 1500);
            });
        });
    </script>
</body>
</html>
